# Render Blueprint for the API. The frontend is deployed separately on Vercel
# (see DEPLOYMENT.md). Values marked `sync: false` are entered in the Render
# dashboard when the Blueprint is first applied and are never committed.
services:
  - type: web
    name: mandela-school-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # Requests reach the app through Cloudflare and two Render hops. Measured
      # on the live service: 1 and 2 log internal/Cloudflare addresses, 3 logs
      # the visitor's own IP and ignores a client-supplied X-Forwarded-For.
      # Without the right value the rate limiters count proxies, not visitors.
      - key: TRUST_PROXY
        value: "3"
      - key: JWT_SECRET
        generateValue: true
      - key: SCHOOL_NAME
        value: Mandela Bilingual Nursery and Primary School
      - key: MONGO_URI
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # Brevo on 2525: the free plan drops outbound SMTP on 25, 465 and 587.
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "2525"
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false
